# --- Display & RGB (Keep disabled if not used to save battery) ---
# CONFIG_ZMK_DISPLAY=y
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# --- Encoder Support ---
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# --- POWER SETTINGS ---
# Increase transmit power. Crucial for split keyboards and interfering environments.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# --- BLUETOOTH STABILITY (ASAHI LINUX FIXES) ---
# Enables newer BLE features required by BlueZ 5.71+ (Fedora 39/40)
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y

# Improves connection stability by adjusting connection intervals
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# --- DANGEROUS SETTINGS REMOVED ---
# 1. REMOVED: CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y 
#    (Reason: Breaks radio timing on nice!nano v2, making it invisible)
# 2. REMOVED: CONFIG_BT_CTLR_PHY_2M=n 
#    (Reason: Keep default speed for now to ensure Left/Right halves can talk easily)

# --- DEBOUNCE (Optional but recommended) ---
# Prevents double-typing. 5ms is standard.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

CONFIG_ZMK_BLE_PASSKEY_ENTRY=n
