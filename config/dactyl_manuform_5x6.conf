# ==========================================
# macOS BLUETOOTH STABILITY SETTINGS
# ==========================================
# Boosts Bluetooth signal strength to help with Mac connection stability
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enables ZMK's optimized connection settings (Critical for macOS)
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# ==========================================
# OPTIONAL HARDWARE FEATURES
# Uncomment these (remove the #) to enable them
# ==========================================

# Encoders
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# OLED Display
# CONFIG_ZMK_DISPLAY=y

# RGB Underglow
# CONFIG_WS2812_STRIP=y
# CONFIG_ZMK_RGB_UNDERGLOW=y


# ==========================================
# DEBUGGING & ADVANCED
# ==========================================
# CONFIG_ZMK_USB_LOGGING=y

# Usually best to let the controller negotiate PHY speed automatically.
# CONFIG_BT_CTLR_PHY_2M=n

# DISABLED: Forcing the internal RC clock can cause Bluetooth timing drift.
# Only uncomment this if your specific hardware documentation explicitly requires it.
# CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
